name: V16 Isolated Cloudflare Zone Canary Preflight (No Deploy)

on:
  pull_request:
    paths:
      - 'src/v16-canary/**'
      - 'src/v16-online/zone-shards.mjs'
      - 'src/v16-online/zone-transport.mjs'
      - 'src/v16-online/zone-presence.mjs'
      - 'tests/v16-isolated-zone-canary.test.mjs'
      - 'wrangler.v16-zone-canary.jsonc'
      - '.github/workflows/v16-isolated-zone-canary.yml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: v16-canary-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-canary:
    name: Security + SQLite DO dry-run only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated gate, daily limits and zones
        run: node --test tests/v16-isolated-zone-canary.test.mjs tests/v16-zone-transport.test.mjs tests/v16-cross-do-shards.test.mjs
      - name: Verify disabled-by-default config and no main Worker alias
        run: |
          node --input-type=module -e "import fs from 'node:fs';const x=JSON.parse(fs.readFileSync('wrangler.v16-zone-canary.jsonc','utf8'));if(x.name!=='treasure-hunt-2d-zone-canary-isolated'||x.vars.CANARY_ENABLED!=='false'||x.durable_objects.bindings.some(y=>y.name==='ROOMS'||y.class_name==='V16WorldRoom')||x.migrations.length!==1)process.exit(1);console.log('Isolated canary: default OFF, dedicated SQLite classes, no live game binding')"
      - name: Wrangler canary dry-run (no deploy, no Cloudflare secrets)
        run: npx --yes wrangler@4 deploy --config wrangler.v16-zone-canary.jsonc --dry-run --outdir /tmp/v16-zone-canary-compile
      - name: Job summary
        run: |
          echo '## Isolated Zone Canary — Preflight Only' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- No Cloudflare API token, Worker deployment or DO invocation is used.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Configuration starts with CANARY_ENABLED=false and has distinct namespace classes.' >> "$GITHUB_STEP_SUMMARY"
          echo '- A real on-platform canary requires a separate operator cost/secret/rollback review.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Real online 10K concurrent players verified: **0**.' >> "$GITHUB_STEP_SUMMARY"
