name: Run scoring offline security tests
on:
  push:
    branches: [feature/validated-run-score-engine-20261028]
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-sqlite-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
