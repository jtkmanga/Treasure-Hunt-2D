name: V16 Offline Capacity Probe (No Chromium / No Network)

on:
  pull_request:
    paths:
      - 'scripts/v16-capacity-harness.mjs'
      - 'scripts/v16-zone-capacity.mjs'
      - 'scripts/v16-cross-do-cost-probe.mjs'
      - 'src/v16-online/zone-shards.mjs'
      - 'src/v16-online/zone-transport.mjs'
      - 'tests/v16-cross-do-shards.test.mjs'
      - 'tests/v16-zone-transport.test.mjs'
      - 'src/v16-online/zone-presence.mjs'
      - 'tests/v16-zone-presence.test.mjs'
      - 'src/v16-online/incremental-leaderboard.mjs'
      - 'src/v16-online/room.mjs'
      - 'tests/v16-incremental-leaderboard.test.mjs'
      - 'tests/v16-capacity-harness.test.mjs'
      - 'package.json'
      - '.github/workflows/v16-offline-capacity.yml'
  workflow_dispatch:
    inputs:
      players:
        description: 'Synthetic actors, NOT real live concurrent players'
        type: choice
        required: true
        default: '100'
        options:
          - '100'
          - '1000'
          - '10000'

permissions:
  contents: read

concurrency:
  group: v16-offline-capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-room-benchmark:
    name: Simulate V16 world without network
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
      ACTORS: ${{ github.event_name == 'pull_request' && '10000' || (github.event_name == 'workflow_dispatch' && inputs.players || '100') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safety + correctness tests
        run: node --test tests/v16-capacity-harness.test.mjs tests/v16-incremental-leaderboard.test.mjs tests/v16-zone-presence.test.mjs tests/v16-cross-do-shards.test.mjs tests/v16-zone-transport.test.mjs
      - name: Measure offline player room
        run: |
          node scripts/v16-capacity-harness.mjs --players "$ACTORS" --moves 1 --polls 5 --contention 100 > v16-offline-capacity.json
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('v16-offline-capacity.json','utf8'));if(d.networkRequests!==0||d.verifiedRealConcurrentPlayers!==0||d.productionReadyConclusion!==false)process.exit(1);process.stdout.write(JSON.stringify({actors:d.simulatedPlayers,phaseMs:d.durationMs,latency:d.latencyMs,heapKiB:d.memoryKiB},null,2)+'\\n')"
      - name: Measure offline 10K zone locality
        run: |
          node scripts/v16-zone-capacity.mjs "$ACTORS" > v16-zone-capacity.json
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('v16-zone-capacity.json','utf8'));if(d.networkRequests!==0||d.verifiedRealConcurrentPlayers!==0||d.productionReadyConclusion!==false||d.maxReturnedPlayers>24)process.exit(1);process.stdout.write(JSON.stringify({actors:d.actors,zoneCount:d.zoneCount,queries:d.queries,crossZoneMigrations:d.crossZoneMigrations,queryLatencyMs:d.queryLatencyMs,phaseMs:d.phaseMs},null,2)+'\\n')"
      - name: Measure offline cross-DO handoff and fan-out budget
        run: |
          node scripts/v16-cross-do-cost-probe.mjs "$ACTORS" 200 > v16-cross-do-cost.json
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('v16-cross-do-cost.json','utf8'));if(d.networkRequests!==0||d.verifiedRealConcurrentPlayers!==0||d.productionReadyConclusion!==false||d.actualCloudflareDORuns!==0||d.maxPlayersReturned>24||d.transport.deadlineCount>0)process.exit(1);process.stdout.write(JSON.stringify({actors:d.simulatedPlayers,zoneDOs:d.syntheticZoneInstances,internalCalls:d.transport.requestCount,peakFanout:d.transport.peakInFlight,p99Ms:d.transport.latency.p99Ms},null,2)+'\\n')"
      - name: Write job summary
        run: |
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('v16-offline-capacity.json','utf8'));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## V16 Offline Capacity Report\\n\\n- Synthetic actors: **'+d.simulatedPlayers+'**\\n- Median join latency (in-process): **'+d.latencyMs.join.p50Ms+' ms**\\n- P99 join latency: **'+d.latencyMs.join.p99Ms+' ms**\\n- Total elapsed: **'+d.durationMs.total+' ms**\\n- Serialized snapshot: **'+d.memoryKiB.serializedSnapshot+' KiB**\\n- Real concurrent users verified: **0**\\n\\n**Not a real Cloudflare 10K load test or production approval.**\\n')"
      - name: Write zone report summary
        run: |
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('v16-zone-capacity.json','utf8'));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\\n## V16 Offline Zone Proximity Report\\n\\n- Synthetic actors: **'+d.actors+'**\\n- Nearby queries: **'+d.queries+'**\\n- Cross-zone updates: **'+d.crossZoneMigrations+'**\\n- P99 in-process proximity lookup: **'+d.queryLatencyMs.p99+' ms**\\n- Max returned per viewer: **'+d.maxReturnedPlayers+'** (cap 24)\\n\\n**Not cross-DO sharding or proven real concurrency.**\\n')"
      - name: Write cross-DO budget summary
        run: |
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('v16-cross-do-cost.json','utf8'));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\\n## V16 Synthetic Cross-DO Cost Envelope\\n\\n- Actors: **'+d.simulatedPlayers+'**\\n- Zone instances: **'+d.syntheticZoneInstances+'**\\n- Simulated DO subrequests: **'+d.transport.requestCount+'**\\n- Peak fanout: **'+d.transport.peakInFlight+'**\\n- Internal p99 latency: **'+d.transport.latency.p99Ms+' ms**\\n- Real Cloudflare DO requests: **0**\\n\\n**Not actual network latency, Cloudflare cost or proven 10K online concurrency.**\\n')"
      - name: Upload synthetic report
        uses: actions/upload-artifact@v4
        with:
          name: v16-offline-capacity-${{ env.ACTORS }}
          path: |
            v16-offline-capacity.json
            v16-zone-capacity.json
            v16-cross-do-cost.json
          retention-days: 7
