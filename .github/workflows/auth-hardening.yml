name: App Check and revocation security tests (no deploy)
on:
  push:
    branches: [feature/appcheck-revocation-gate-20261028]
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test offline game and backend security
        run: npm test
