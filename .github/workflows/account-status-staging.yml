name: Revocation and disabled-account Staging tests (no deploy)
on:
  push:
    branches: [feature/revoked-account-readonly-20261029]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Live Staging denial and CORS smoke checks (no private user tokens)
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://treasure-hunt-2d-staging-api.hjinffv5426.workers.dev"
          ORIGIN="https://treasure-hunt-2d-jtk.pages.dev"
          check () {
            local expected="$1"; shift
            local actual
            actual=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$@")
            echo "HTTP $actual (expected $expected)"
            test "$actual" = "$expected"
          }
          check 403 "$BASE/api/v1/account-status"
          check 401 -H "Origin: $ORIGIN" "$BASE/api/v1/account-status"
          check 405 -X POST -H "Origin: $ORIGIN" "$BASE/api/v1/account-status"
          check 204 -X OPTIONS -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: authorization,x-firebase-appcheck" "$BASE/api/v1/account-status"
          check 401 -H "Origin: $ORIGIN" "$BASE/api/v1/appcheck-verify"
          check 404 -H "Origin: $ORIGIN" "$BASE/api/v1/score"
          check 404 -H "Origin: $ORIGIN" "$BASE/api/v1/appcheck-jwks-probe"
      - name: Ensure no private key, billing or paid route added
        shell: bash
        run: |
          grep -q 'accountStatusVerified:true' src/online/account-status-staging.mjs
          ! grep -E '(-----BEGIN PRIVATE KEY-----|sk_live_|ghp_)' src/online/account-status-staging.mjs
