name: Online API foundation tests (no deploy)
on:
  push:
    branches:
      - feature/http-auth-leaderboard-foundation-20261028
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
