name: Mobile Firebase Login unit tests (no deploy)
on:
  push:
    branches:
      - feature/mobile-google-login-prep-20261028
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
