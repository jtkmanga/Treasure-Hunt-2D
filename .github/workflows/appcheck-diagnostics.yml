name: App Check safe diagnostic regression and public JWKS probe
on:
  push:
    branches: [fix/appcheck-staging-diagnostics-20261029]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit, security and 2D offline regression
        run: npm test
      - name: Probe Firebase public JWKS shape without any private token
        run: |
          node --input-type=module - <<'JS'
          import {webcrypto} from 'node:crypto';
          const response = await fetch('https://firebaseappcheck.googleapis.com/v1/jwks', {signal:AbortSignal.timeout(10000)});
          if(!response.ok)throw Error('Firebase public JWKS unavailable HTTP '+response.status);
          const body=await response.json();
          if(!Array.isArray(body.keys)||body.keys.length<1)throw Error('No public signing keys');
          for(const key of body.keys){
            if(key.kty!=='RSA'||typeof key.kid!=='string'||!key.n||!key.e)throw Error('Unexpected JWKS shape');
            await webcrypto.subtle.importKey('jwk',key,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['verify']);
          }
          console.log('Firebase PUBLIC App Check JWKS and RSA import OK, keys:',body.keys.length);
          JS
      - name: Probe negative HTTP statuses; never request actual App Check tokens
        run: |
          set -euo pipefail
          BASE="https://treasure-hunt-2d-staging-api.hjinffv5426.workers.dev"
          status=$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' "$BASE/api/v1/appcheck-verify")
          test "$status" = "403"
          status=$(curl -sS --max-time 12 -H 'Origin: https://treasure-hunt-2d-jtk.pages.dev' -o /dev/null -w '%{http_code}' "$BASE/api/v1/appcheck-verify")
          test "$status" = "401"
          echo "Staging negative HTTP checks passed"
      - name: Pack only static preview (not deployed)
        shell: bash
        run: |
          mkdir -p preview/login preview/src/client
          cp index.html preview/index.html
          cp login/index.html login/login.mjs preview/login/
          cp src/client/firebase-login-core.mjs src/client/appcheck-prep.mjs preview/src/client/
          test "$(find preview -type f | wc -l)" -eq 5
          ! find preview -type f | grep -E '(service-account|firebase-config|private-key|\.env)'
      - uses: actions/upload-artifact@v4
        with:
          name: treasure-hunt-2d-appcheck-diagnostic
          path: preview/
          retention-days: 14
          if-no-files-found: error
