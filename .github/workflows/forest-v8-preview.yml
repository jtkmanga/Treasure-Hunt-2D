name: Forest V8 mobile preview - safe ZIP
on:
  pull_request:
    paths:
      - 'forest-v8/**'
      - 'src/online/forest-contest-core.mjs'
      - 'tests/forest-v8.test.mjs'
      - 'tests/forest-contest-core.test.mjs'
      - 'tests/forest-v8-sql.test.mjs'
      - 'db/forest-v8.sql'
      - '.github/workflows/forest-v8-preview.yml'
      - 'scripts/build-forest-v8-standalone.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full regression and forest V8 tests
        run: npm test
      - name: Verify V8 modules parse without browser
        run: |
          for f in forest-v8/*.mjs src/online/forest-contest-core.mjs; do node --check "$f"; done
      - name: Build offline playable single-file game
        run: |
          python3 scripts/build-forest-v8-standalone.py
          node --check build/forest-v8-bundle-check.js
          test -s build/Treasure-Hunt-2D-Forest-V8-Playable.html
      - name: Upload playable offline HTML for phones
        uses: actions/upload-artifact@v4
        with:
          name: Treasure-Hunt-2D-Forest-V8-Playable-HTML
          path: build/Treasure-Hunt-2D-Forest-V8-Playable.html
          if-no-files-found: error
      - name: Pack isolated mobile preview without any backend credentials
        run: |
          mkdir -p site/forest-v8
          cp forest-v8/index.html forest-v8/*.mjs site/forest-v8/
          cp index.html site/index.html
          test -f site/forest-v8/forest-engine.mjs
          test -f site/forest-v8/cohesive-world.mjs
          ! grep -rE '(sk_live_|SLIP2GO_SECRET|private_key)' site/
          cd site
          zip -qr ../Treasure-Hunt-2D-Forest-V8-Mobile.zip .
      - name: Upload manual-test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Treasure-Hunt-2D-Forest-V8-Mobile
          path: Treasure-Hunt-2D-Forest-V8-Mobile.zip
          if-no-files-found: error

      - name: Check whether preview deploy credentials are available
        id: preview-credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "HAS_CLOUDFLARE_TOKEN=true" >> "$GITHUB_ENV"; else echo "Cloudflare token not configured; standalone HTML is still available."; fi
      - name: Publish separate Cloudflare Pages preview (never production)
        if: ${{ env.HAS_CLOUDFLARE_TOKEN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4cafc1910d08ee7c62dd4a1e2adb6e64
        run: |
          npx --yes wrangler@4 pages deploy forest-v8 --project-name=treasure-hunt-2d-jtk --branch=forest-v8-mobile-demo --commit-hash="${{ github.event.pull_request.head.sha || github.sha }}"
