name: 2D App Check backend tests and mobile ZIP
on:
  push:
    branches: [feature/appcheck-worker-readonly-20261028]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Limited live Staging negative HTTP checks (no user tokens)
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://treasure-hunt-2d-staging-api.hjinffv5426.workers.dev"
          ORIGIN="https://treasure-hunt-2d-jtk.pages.dev"
          status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$BASE/api/v1/appcheck-verify")
          echo "No Origin HTTP $status"
          test "$status" = "403"
          status=$(curl -sS --max-time 15 -H "Origin: $ORIGIN" -o /dev/null -w '%{http_code}' "$BASE/api/v1/appcheck-verify")
          echo "No login HTTP $status"
          test "$status" = "401"
          status=$(curl -sS --max-time 15 -H "Origin: $ORIGIN" -o /dev/null -w '%{http_code}' "$BASE/api/v1/score")
          echo "Score endpoint HTTP $status"
          test "$status" = "404"
          status=$(curl -sS --max-time 15 -X OPTIONS -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: GET' -H 'Access-Control-Request-Headers: authorization,x-firebase-appcheck' -o /dev/null -w '%{http_code}' "$BASE/api/v1/appcheck-verify")
          echo "Preflight HTTP $status"
          test "$status" = "204"
      - name: Package only public client files
        shell: bash
        run: |
          mkdir -p preview/login preview/src/client
          cp index.html preview/index.html
          cp login/index.html login/login.mjs preview/login/
          cp src/client/firebase-login-core.mjs src/client/appcheck-prep.mjs preview/src/client/
          test "$(find preview -type f | wc -l)" -eq 5
          ! find preview -type f | grep -E '(firebase-config|service-account|private-key)'
      - uses: actions/upload-artifact@v4
        with:
          name: treasure-hunt-2d-appcheck-staging-verified
          path: preview/
          retention-days: 14
